apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: newsfeed
spec:
  schedule: "0 21 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: pgvector/pgvector:0.7.4-pg16
              command:
                - sh
                - -c
                - |
                  set -e
                  OUT=/dump/newsfeed-$(date +%Y%m%d-%H%M%S).dump
                  pg_dump -h newsfeed-postgres -U newsfeed -d newsfeed -Fc -f "$OUT"
                  ls -lh /dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: newsfeed-secrets, key: DB_PASSWORD }
              volumeMounts:
                - { name: dump, mountPath: /dump }
          containers:
            - name: upload
              image: minio/mc:latest
              command:
                - sh
                - -c
                - |
                  set -e
                  mc alias set bk http://minio.minio.svc.cluster.local:9000 "$ACCESS_KEY" "$SECRET_KEY"
                  mc cp /dump/*.dump bk/backups/newsfeed-postgres/
                  mc ls bk/backups/newsfeed-postgres/
              env:
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: minio-backup, key: accessKey }
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: minio-backup, key: secretKey }
              volumeMounts:
                - { name: dump, mountPath: /dump }
          volumes:
            - name: dump
              emptyDir: {}
