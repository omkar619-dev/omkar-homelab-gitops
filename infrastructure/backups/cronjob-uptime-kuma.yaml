apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-backup
  namespace: uptime-kuma
spec:
  schedule: "30 21 * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl
                  curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
                  chmod +x /usr/local/bin/mc
                  TS=$(date +%Y%m%d-%H%M%S)
                  tar czf /tmp/uptime-kuma-$TS.tar.gz -C /data .
                  mc alias set bk http://minio.minio.svc.cluster.local:9000 "$ACCESS_KEY" "$SECRET_KEY"
                  mc cp /tmp/uptime-kuma-$TS.tar.gz bk/backups/uptime-kuma/
                  mc ls bk/backups/uptime-kuma/
              env:
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: minio-backup, key: accessKey }
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: minio-backup, key: secretKey }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: uptime-kuma-data
